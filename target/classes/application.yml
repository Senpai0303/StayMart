spring:
  application:
    name: staymart
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/staymart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        auto_quote_keyword: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:StayMartJwtSecretKeyForDehradunUttarakhandPlatform2026SecureRandomValue}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081,http://127.0.0.1:8081}
  ml:
    base-url: ${ML_BASE_URL:http://localhost:5000}
  seed:
    admin-name: StayMart Admin
    admin-email: ${SEED_ADMIN_EMAIL:admin@staymart.com}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
