<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Requests Received - StayMart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body class="dash-body">
  <button class="dash-hamburger" id="dashHamburger" aria-label="Toggle menu">☰</button>
  <div class="dash-overlay" id="dashOverlay"></div>

  <aside class="dash-sidebar" id="dashSidebar">
    <a class="dash-brand logo" href="../../index.html">StayMart<small>Dehradun · Uttarakhand</small></a>
    <nav class="dash-nav" id="dashNav"></nav>
    <div class="dash-user" id="dashUser"></div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div>
        <h1 class="dash-title" data-dash-title>Requests Received</h1>
        <p class="dash-subtitle" data-dash-subtitle>Booking and order requests on your listings</p>
      </div>
      <div class="dash-topbar-actions">
        <a href="my-listings.html" class="btn btn-secondary btn-sm">My Listings</a>
      </div>
    </header>

    <div class="dash-content">
      <div class="dash-section">
        <div class="tabs">
          <button class="tab active" data-tab="bookings" onclick="switchRequestTab('bookings')">📅 Bookings</button>
          <button class="tab" data-tab="orders" onclick="switchRequestTab('orders')">📦 Orders</button>
        </div>
      </div>

      <section class="panel">
        <div class="panel-header">
          <span class="panel-title" id="reqPanelTitle">Incoming Bookings</span>
          <div class="panel-actions"><span class="pill" id="reqCount">…</span></div>
        </div>
        <div class="panel-body no-pad" id="requestsBox">
          <div class="loading-block"><div class="row-skeleton"></div><div class="row-skeleton"></div></div>
        </div>
      </section>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/dashboard.js"></script>
  <script src="../../js/requests-received.js"></script>
</body>
</html>
