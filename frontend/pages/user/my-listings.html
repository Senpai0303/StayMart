<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Listings - StayMart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body class="dash-body">
  <button class="dash-hamburger" id="dashHamburger" aria-label="Toggle menu">☰</button>
  <div class="dash-overlay" id="dashOverlay"></div>

  <aside class="dash-sidebar" id="dashSidebar">
    <a class="dash-brand logo" href="../../index.html">StayMart<small>Dehradun · Uttarakhand</small></a>
    <nav class="dash-nav" id="dashNav"></nav>
    <div class="dash-user" id="dashUser"></div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div>
        <h1 class="dash-title" data-dash-title>My Listings</h1>
        <p class="dash-subtitle" data-dash-subtitle>Manage your properties and products</p>
      </div>
      <div class="dash-topbar-actions">
        <a href="../../post-property.html" class="btn btn-secondary btn-sm">+ Property</a>
        <a href="../../post-product.html" class="btn btn-primary btn-sm">+ Product</a>
      </div>
    </header>

    <div class="dash-content">
      <div class="dash-section">
        <div class="tabs">
          <button class="tab active" data-tab="properties" onclick="switchListingTab('properties')">🏠 Properties</button>
          <button class="tab" data-tab="products" onclick="switchListingTab('products')">📦 Products</button>
        </div>
      </div>

      <section class="panel">
        <div class="panel-header">
          <span class="panel-title" id="listPanelTitle">My Properties</span>
          <div class="panel-actions">
            <span class="pill" id="listCount">…</span>
          </div>
        </div>
        <div class="panel-body no-pad" id="listingsBox">
          <div class="loading-block"><div class="row-skeleton"></div><div class="row-skeleton"></div><div class="row-skeleton"></div></div>
        </div>
      </section>
      <div class="pagination" id="listingsPagination"></div>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/dashboard.js"></script>
  <script src="../../js/my-listings.js"></script>
</body>
</html>
