<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages - StayMart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body class="dash-body">
  <button class="dash-hamburger" id="dashHamburger" aria-label="Toggle menu">☰</button>
  <div class="dash-overlay" id="dashOverlay"></div>

  <aside class="dash-sidebar" id="dashSidebar">
    <a class="dash-brand logo" href="../../index.html">StayMart<small>Dehradun · Uttarakhand</small></a>
    <nav class="dash-nav" id="dashNav"></nav>
    <div class="dash-user" id="dashUser"></div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div>
        <h1 class="dash-title" data-dash-title>Messages</h1>
        <p class="dash-subtitle" data-dash-subtitle>Chat with buyers, sellers and owners</p>
      </div>
    </header>

    <div class="dash-content">
      <div class="chat-layout">
        <div class="convo-list" id="convoList">
          <div class="loading-block"><div class="row-skeleton"></div><div class="row-skeleton"></div><div class="row-skeleton"></div></div>
        </div>
        <div class="chat-panel">
          <div class="chat-head" id="chatHead">
            <div class="list-main"><div class="lr-title">Select a conversation</div><div class="lr-sub">Choose someone from the list to start chatting</div></div>
          </div>
          <div class="chat-body" id="chatBody">
            <div class="inline-empty"><span class="empty-icon">💬</span><p>No messages yet</p></div>
          </div>
          <form class="chat-input" id="chatForm" style="display:none">
            <input id="chatInput" type="text" placeholder="Type a message..." autocomplete="off" maxlength="2000"/>
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/dashboard.js"></script>
  <script src="../../js/chat.js"></script>
</body>
</html>
