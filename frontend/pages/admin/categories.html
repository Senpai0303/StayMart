<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Categories - StayMart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body class="dash-body">
  <button class="dash-hamburger" id="dashHamburger" aria-label="Toggle menu">☰</button>
  <div class="dash-overlay" id="dashOverlay"></div>

  <aside class="dash-sidebar" id="dashSidebar">
    <a class="dash-brand logo" href="../../index.html">StayMart<small>Admin Console</small></a>
    <nav class="dash-nav" id="dashNav"></nav>
    <div class="dash-user" id="dashUser"></div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div>
        <h1 class="dash-title" data-dash-title>Categories</h1>
        <p class="dash-subtitle" data-dash-subtitle>Manage product & accommodation categories</p>
      </div>
      <div class="dash-topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openCategoryModal()">+ New Category</button>
      </div>
    </header>

    <div class="dash-content">
      <div class="dash-section">
        <div class="tabs" id="catTabs">
          <button class="tab active" data-type="" onclick="filterCategories('')">All</button>
          <button class="tab" data-type="ACCOMMODATION" onclick="filterCategories('ACCOMMODATION')">Accommodation</button>
          <button class="tab" data-type="PRODUCT" onclick="filterCategories('PRODUCT')">Products</button>
        </div>
      </div>

      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">Category List</span>
          <div class="panel-actions"><span class="pill" id="catCount">…</span></div>
        </div>
        <div class="panel-body no-pad">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Icon</th>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Parent ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="catBody">
                <tr><td colspan="5" class="inline-empty">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/dashboard.js"></script>
  <script src="../../js/admin-categories.js"></script>
</body>
</html>
