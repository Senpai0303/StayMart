<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Locations - StayMart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body class="dash-body">
  <button class="dash-hamburger" id="dashHamburger" aria-label="Toggle menu">☰</button>
  <div class="dash-overlay" id="dashOverlay"></div>

  <aside class="dash-sidebar" id="dashSidebar">
    <a class="dash-brand logo" href="../../index.html">StayMart<small>Admin Console</small></a>
    <nav class="dash-nav" id="dashNav"></nav>
    <div class="dash-user" id="dashUser"></div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div>
        <h1 class="dash-title" data-dash-title>Locations</h1>
        <p class="dash-subtitle" data-dash-subtitle>Cities and areas across Uttarakhand</p>
      </div>
      <div class="dash-topbar-actions">
        <input type="search" id="locSearch" class="search-input" placeholder="Search city or area..." oninput="filterLocations()"/>
        <button class="btn btn-primary btn-sm" onclick="openLocationModal()">+ New Location</button>
      </div>
    </header>

    <div class="dash-content">
      <section class="panel">
        <div class="panel-header">
          <span class="panel-title">Location List</span>
          <div class="panel-actions"><span class="pill" id="locCount">…</span></div>
        </div>
        <div class="panel-body no-pad">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>City</th>
                  <th>Area</th>
                  <th>State</th>
                  <th>Pincode</th>
                  <th>Coordinates</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="locBody">
                <tr><td colspan="6" class="inline-empty">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/dashboard.js"></script>
  <script src="../../js/admin-locations.js"></script>
</body>
</html>
