<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - StayMart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"/>
  <link rel="stylesheet" href="css/global.css"/>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="logo">StayMart<small style="text-align:center">Dehradun · Uttarakhand</small></a>
      <h1 class="auth-heading" style="margin-top:16px">Welcome Back 👋</h1>
      <p class="auth-sub">Login to post listings, book properties & chat with owners.</p>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-with-icon">
            <span class="field-icon">✉️</span>
            <input id="email" type="email" placeholder="you@example.com" required autocomplete="email"/>
          </div>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <span class="field-icon">🔒</span>
            <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password"/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Login</button>
      </form>

      <div class="auth-link">New to StayMart? <a href="register.html">Create an account</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
